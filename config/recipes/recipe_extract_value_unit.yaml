# =============================================================================
# Recipe: split combined value+unit cells such as "3.4 Bq/kg"
#
# Symptom:
#   The measured value and its unit are stored in the same cell.
#   Examples: "3.4 Bq/kg", "1.2e-3 mBq/L", "3.4 (Bq/kg)", "<0.5 Bq/kg"
#
# Usage:
#   1. Replace src_col with the real combined source column.
#   2. Make the Step 1 destination column name match melt.spec.val.
#   3. Pick the Step 2 pattern that matches your unit formatting.
#   4. Replace template.yaml's pre_cbs: [] line with this entire block.
#
# Warning: SoftRegexTransformCB applies one cast to every destination column.
#   VALUE (float) and UNIT (str) therefore cannot be extracted safely in one pass.
#   This recipe intentionally uses two callbacks to avoid cast collisions.
#
# Warning: melt.spec.unit is a fixed literal, not a per-row column reference.
#   If every row shares the same unit, Step 2 is unnecessary and melt.spec.unit
#   can be written directly. If units vary per row, normalize them later in post_cbs.
# =============================================================================

pre_cbs:

  # Step 1: extract the numeric part as float -> create the melt.spec value column
  - name: SoftRegexTransformCB
    args:
      src_col:  "Cs137_measured"            # Replace with the real combined source column
      # [\d.]+ matches integers/decimals; the optional exponent part supports 1.2e-3
      pattern:  "(?P<Cs137_Bq_kg>[\d.]+(?:[eE][+-]?\d+)?)"
      dst_cols: ["Cs137_Bq_kg"]            # Must match melt.spec.val
      cast:     "float"

  # Step 2a: extract the unit from parenthesized cells such as "3.4 (Bq/kg)"
  - name: SoftExtractUnitFromColCB
    args:
      src_col: "Cs137_measured"
      dst_col: "Cs137_unit_raw"
      pattern: "\((.*?)\)"

  # Step 2b: for space-separated cells such as "3.4 Bq/kg", use this pattern instead:
  # pattern: "[\d.]+(?:[eE][+-]?\d+)?\s+(.+)"

  # Step 2c: if the unit is constant in every row, remove Step 2 entirely and put
  # the unit token directly into melt.spec.unit.
