# =============================================================================
# Recipe: convert degree/minute/second + hemisphere columns into decimal LAT/LON
#
# Symptom:
#   Coordinates are split across four columns for latitude and four for longitude.
#   Example:
#     Lat_D | Lat_M | Lat_S | Lat_Dir || Lon_D | Lon_M | Lon_S | Lon_Dir
#      78   |  30   |   0   |    N    ||  15   |  12   |   0   |    E
#
# Usage:
#   1. Replace col_deg / col_min / col_sec / col_dir with the real column names.
#   2. Replace template.yaml's pre_cbs: [] line with this entire block.
#
# Warning: col_dir is mandatory. SoftDMStoDecimalCB reads it unconditionally.
#   If you leave col_dir=None, df[None] will immediately raise KeyError.
#   If the source file has no hemisphere column, create a constant column first.
#
# Warning: col_deg / col_min / col_sec must already be numeric.
#   If the CSV loader reads them as strings, convert them before this recipe runs.
#
# Warning: do not map Lat_D / Lon_D style columns to LAT/LON in columns:.
# =============================================================================

pre_cbs:

  # Build LAT
  - name: SoftDMStoDecimalCB
    args:
      col_deg: "Lat_D"       # Replace with latitude degrees column
      col_min: "Lat_M"       # Replace with latitude minutes column
      col_sec: "Lat_S"       # Replace with latitude seconds column
      col_dir: "Lat_Dir"     # Replace with latitude hemisphere column (N/S)
      dst_col: "LAT"         # Destination column (fixed)
      neg_dir: ["S", "W"]   # Directions that should become negative

  # Build LON
  - name: SoftDMStoDecimalCB
    args:
      col_deg: "Lon_D"       # Replace with longitude degrees column
      col_min: "Lon_M"       # Replace with longitude minutes column
      col_sec: "Lon_S"       # Replace with longitude seconds column
      col_dir: "Lon_Dir"     # Replace with longitude hemisphere column (E/W)
      dst_col: "LON"         # Destination column (fixed)
      neg_dir: ["S", "W"]   # Directions that should become negative

  # Minute-only variant (no seconds column)
  # If your source has no seconds field, create a zero-filled helper column first
  # and pass that helper as col_sec.
