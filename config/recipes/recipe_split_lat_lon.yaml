# =============================================================================
# Recipe: split combined coordinates into LAT/LON from a single source column
#
# Symptom:
#   Latitude and longitude are stored in one column separated by "/" or ",".
#   Examples: "45.5/135.2", "-78.3/15.8", "78.5N,15.2E"
#
# Usage:
#   1. Rename src_col to the real source column name.
#   2. Pick the regex pattern that matches your delimiter format.
#   3. Replace template.yaml's pre_cbs: [] line with this entire block.
#
# Warning: never map the combined source column directly to LAT/LON in columns:.
#   If you do, the raw string (for example "45.5/135.2") lands in LAT and
#   Rail 9's _GuardedSanitizeLonLatCB will fail on float conversion.
#   Generate LAT/LON in pre_cbs first, then let the shared pipeline continue.
#
# Warning: SoftRegexTransformCB applies one cast to every destination column.
#   This recipe is safe because both LAT and LON are floats.
# =============================================================================

pre_cbs:

  # Variation 1: slash-separated values such as "45.5/135.2" or "-78.3/-15.8"
  - name: SoftRegexTransformCB
    args:
      src_col:  "lat_lon"            # Replace with the real combined coordinate column
      # [-\d.]+ also supports southern/western negative values
      pattern:  "(?P<LAT>[-\d.]+)/(?P<LON>[-\d.]+)"
      dst_cols: ["LAT", "LON"]      # Must match the named capture groups
      cast:     "float"

  # Variation 2: comma-separated values such as "78.5N,15.2E"
  # This extracts only the numeric part. If hemisphere signs must be applied,
  # follow with a dedicated coordinate callback.
  # - name: SoftRegexTransformCB
  #   args:
  #     src_col:  "position"
  #     pattern:  "(?P<LAT>[\d.]+)[NS],\s*(?P<LON>[\d.]+)[EW]"
  #     dst_cols: ["LAT", "LON"]
  #     cast:     "float"

  # Variation 3: whitespace-separated values such as "45 135"
  # - name: SoftRegexTransformCB
  #   args:
  #     src_col:  "lat_lon"
  #     pattern:  "(?P<LAT>[-\d.]+)\s+(?P<LON>[-\d.]+)"
  #     dst_cols: ["LAT", "LON"]
  #     cast:     "float"
