# config/handlers/template.yaml — marisco 3.0 minimal handler skeleton
#
# Usage: copy this file to config/handlers/<dataset_name>.yaml and
# replace the placeholders with values that match your dataset.
#
# Chaos-data helpers: paste one of the following recipes into pre_cbs: / post_cbs:
#   Combined latitude/longitude in one column  -> config/recipes/recipe_split_lat_lon.yaml
#   Degrees/minutes/seconds + hemisphere cols  -> config/recipes/recipe_dms_to_decimal.yaml
#   Value and unit combined in one cell        -> config/recipes/recipe_extract_value_unit.yaml
# -----------------------------------------------------------------------------

handler:
  module_name: handlers.my_dataset          # Python module path (handlers.<name>)
  title: "My Dataset YYYY"
  description: "Brief dataset description."

data_source:
  url: "https://zenodo.org/records/XXXXXXX/files/my_data.csv?download=1"
  fname_out: "my_dataset.nc"
  zenodo_id: "XXXXXXX"
  format: csv                               # csv | tsv

# Raw CSV column name -> canonical MARIS column name (renamed in Rail 1)
columns:
  Latitude_deg:   LAT
  Longitude_deg:  LON
  Depth_m:        SMP_DEPTH
  Temperature_C:  TEMP
  Salinity:       SAL
  Station:        STATION
  Sample_ID:      SMP_ID_PROVIDER

rename_cols:
  mapping: {}                               # Fill only if extra mappings are needed
  string_cast: [STATION, SMP_ID_PROVIDER]   # Columns that may otherwise be parsed as numeric

parse_datetime:
  col_date: Date
  col_time: Time                            # Remove this line if there is no time column
  format: "%d/%m/%Y %H:%M:%S"              # Python strftime notation

melt:
  meta_cols: [STATION, SMP_ID_PROVIDER, LAT, LON, TIME, SMP_DEPTH, TEMP, SAL]
  spec:
    # val: measurement column  unc: uncertainty column  nuclide/unit/lab must match nomenclature keys
    - {val: Cs137_Bq_kg, unc: Cs137_unc_Bq_kg, nuclide: Cs137, unit: Bq_kg, lab: IAEA}

unit_conversions: []                        # Keep as an empty list if no unit conversion is required

nomenclatures:
  nuclide_lut: {Cs137: 2}                   # Nuclide token -> MARIS ID (dbo_nuclide.xlsx)
  unit_lut:    {Bq_kg: 1}                   # Unit token    -> MARIS ID (dbo_unit.xlsx)
  lab_lut:     {IAEA: 4}                    # Lab token     -> MARIS ID (dbo_lab.xlsx)
  lab_constants: {}
  area_default: 0                           # dbo_area.xlsx ID (0 = unset)

output:
  keywords: [radionuclides, seawater]

pre_cbs: []   # Paste recipe list entries here when the source data needs chaos handling
post_cbs: []  # Paste post-melt clean-up callbacks here when needed
