# config/handlers/template.yaml — marisco 3.0 最小骨格テンプレート
#
# 【使い方】 このファイルを config/handlers/<データセット名>.yaml にコピーして
#            プレースホルダーを実データに合わせて書き換えてください。
#
# 【カオスデータ対応】 以下のレシピを pre_cbs: / post_cbs: にペーストしてください:
#   緯度経度が 1 列に合体         → config/recipes/recipe_split_lat_lon.yaml
#   度・分・秒・方位の 4 列分割   → config/recipes/recipe_dms_to_decimal.yaml
#   濃度値と単位が同一セルに混在  → config/recipes/recipe_extract_value_unit.yaml
# ──────────────────────────────────────────────────────────────────────────────

handler:
  module_name: handlers.my_dataset          # Python モジュールパス (handlers.<名前>)
  title: "My Dataset YYYY"
  description: "Brief dataset description."

data_source:
  url: "https://zenodo.org/records/XXXXXXX/files/my_data.csv?download=1"
  fname_out: "my_dataset.nc"
  zenodo_id: "XXXXXXX"
  format: csv                               # csv | tsv

# 生 CSV 列名 → MARIS 正典列名 (Rail 1 で rename される)
columns:
  Latitude_deg:   LAT
  Longitude_deg:  LON
  Depth_m:        SMP_DEPTH
  Temperature_C:  TEMP
  Salinity:       SAL
  Station:        STATION
  Sample_ID:      SMP_ID_PROVIDER

rename_cols:
  mapping: {}                               # 追加マッピングが必要な場合のみ記入
  string_cast: [STATION, SMP_ID_PROVIDER]  # 数値として読まれる可能性がある列

parse_datetime:
  col_date: Date
  col_time: Time                            # 時刻列がない場合はこの行を削除
  format: "%d/%m/%Y %H:%M:%S"              # Python strftime 記法

melt:
  meta_cols: [STATION, SMP_ID_PROVIDER, LAT, LON, TIME, SMP_DEPTH, TEMP, SAL]
  spec:
    # val: 濃度値列名  unc: 不確かさ列名  nuclide/unit/lab は nomenclatures のキーと一致
    - {val: Cs137_Bq_kg, unc: Cs137_unc_Bq_kg, nuclide: Cs137, unit: Bq_kg, lab: IAEA}

unit_conversions: []                        # 単位変換が不要な場合は空リストのまま

nomenclatures:
  nuclide_lut: {Cs137: 2}                  # 核種名 → MARIS ID (dbo_nuclide.xlsx)
  unit_lut:    {Bq_kg: 1}                  # 単位名 → MARIS ID (dbo_unit.xlsx)
  lab_lut:     {IAEA: 4}                   # 機関名 → MARIS ID (dbo_lab.xlsx)
  lab_constants: {}
  area_default: 0                           # dbo_area.xlsx ID (0 = 未設定)

output:
  keywords: [radionuclides, seawater]

pre_cbs: []   # ← カオスデータ対応が必要な場合、レシピのリストエントリをここにペースト
post_cbs: []  # ← melt 後の後処理が必要な場合にペースト
