handler:
  module_name: handlers.supplement_table_SAS2021
  title: "Synoptic Arctic Survey 2021 Supplementary Table"
  description: >
    Declarative trial of the marisco 3.0 general pipeline against the SAS2021
    supplementary CSV distributed via Zenodo.

data_source:
  url: "https://zenodo.org/records/15056897/files/supplement_table_SAS2021.csv?download=1"
  fname_out: "supplement_table_SAS2021.nc"
  zenodo_id: "15056897"
  format: csv

columns:
  Latitude: LAT
  Longitude: LON
  Date_Time: TIME
  Station: STATION
  Event: SMP_ID_PROVIDER
  DepthWater_m_: SMP_DEPTH
  BottomDepth_m: TOT_DEPTH
  Temp___C_: TEMP
  Sal: SAL

rename_cols:
  mapping: {}
  string_cast: [STATION, SMP_ID_PROVIDER]

parse_datetime:
  col_date: TIME
  format: "%Y-%m-%dT%H:%M:%S"

melt:
  meta_cols: [STATION, SMP_ID_PROVIDER, LAT, LON, TIME, SMP_DEPTH, TOT_DEPTH, TEMP, SAL]
  spec:
    - {val: I129_at_l, unc: unc_I129_at_l, nuclide: I129, unit: at_l, lab: UNSET}
    - {val: U236_at_l, unc: unc_U236_at_l, nuclide: U236, unit: at_l, lab: UNSET}

unit_conversions: []

nomenclatures:
  nuclide_lut: {I129: 28, U236: 108}
  unit_lut: {at_l: 12}
  lab_lut: {UNSET: 0}
  lab_constants: {}
  area_default: 0

output:
  keywords: [Synoptic Arctic Survey, SAS2021, Arctic Ocean, seawater, radionuclides]
  global_attrs:
    title: "Synoptic Arctic Survey 2021 Supplementary Table"
    summary: "Purely declarative marisco 3.0 trial against the SAS2021 supplementary CSV from Zenodo."
    metadata_link: "https://zenodo.org/records/15056897"
