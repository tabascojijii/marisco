# HELCOM MORS 2024 — GeneralHandler 2.0 YAML data contract (S-7d完成版)
# Drives marisco.handlers.general.encode("config/handlers/helcom.yaml")
#
# 設計思想: 「ドメイン国境が美しく直立した名詞のシート」
#   ① 標準コアパイプライン（11本レイル）はインフラが自動結合 → YAML に CB 名を書かない
#   ② ケース正規化は normalize_case で宣言 → インフラが encode() 冒頭で自動配備
#   ③ HELCOM 固有の処理は将来的に loader と共通エンジンへ再配置されるべき対象
#   ④ ハリボテ Helcom*RemapCB は全廃 → SoftAssetRemapCB + pre-resolved CSV で代替

handler:
  module_name: handlers.helcom
  title: "HELCOM MORS 2024"
  description: >
    HELCOM (Helsinki Commission) Monitoring of Radioactive Substances (MORS)
    in the Baltic Sea. Encoded via GeneralHandler 2.0 plugin rail.

data_source:
  url: "https://raw.githubusercontent.com/franckalbinet/maris-crawlers/refs/heads/main/data/processed/HELCOM%20MORS"
  fname_out: "_data/output/100-HELCOM-MORS-2024-general.nc"

# ── ケース正規化：インフラが標準コアレイルの前に自動配備 ──────────────────────────
normalize_case:
  nuclide: NUCLIDE

# Custom loader: 6-file HELCOM data (BIO01/BIO02, SEA01/SEA02, SED01/SED02)
loader:
  path: "marisco.handlers.helcom.load_data_helcom"
  args: {}

# ── Plugin pre-chain: HELCOM 固有パイプライン ─────────────────────────────────

  # ── CHAOS CB 1: ZeroMonthDayClampCB ──────────────────────────────────────
  - path: "marisco.handlers.helcom.ZeroMonthDayClampCB"
    args: {day_col: "day", month_col: "month"}

  # 2-stage date parsing: date 列 → NaT なら year/month/day fallback
  - path: "marisco.handlers.helcom.ParseTimeCB"
    args: {}

  # Sediment melt + value standardisation
  - path: "marisco.handlers.helcom.MeltSedimentValuesCB"
    args: {}
  - path: "marisco.handlers.helcom.SanitizeValueCB"
    args: {}
  - path: "marisco.handlers.helcom.NormalizeUncCB"
    args: {}

  # Per-group multi-logic UNIT assignment
  - path: "marisco.handlers.helcom.RemapUnitCB"
    args: {}
  - path: "marisco.handlers.helcom.RemapDetectionLimitCB"
    args: {}

  # ── BIOTA lookups (pre-resolved CSVs) ────────────────────────────────────
  - path: "marisco.callbacks.SoftAssetRemapCB"
    args:
      asset_path: helcom_species.csv
      key_col: rubin
      val_col: species_id
      col_src: rubin
      col_remap: SPECIES
      grps: [BIOTA]

  - path: "marisco.callbacks.SoftAssetRemapCB"
    args:
      asset_path: helcom_tissue.csv
      key_col: tissue
      val_col: bodypar_id
      col_src: tissue
      col_remap: BODY_PART
      grps: [BIOTA]

  - path: "marisco.callbacks.SoftAssetRemapCB"
    args:
      lut_key: SPECIES
      key_col: species_id
      val_col: biogroup_id
      col_src: SPECIES
      col_remap: BIO_GROUP
      grps: [BIOTA]

  # ── CHAOS CB 2: CleanSedimentCodesCB ─────────────────────────────────────
  - path: "marisco.handlers.helcom.CleanSedimentCodesCB"
    args:
      replace_lut:
        56: -99
        73: -99

  # ── Sediment type (pre-resolved CSV) ─────────────────────────────────────
  - path: "marisco.callbacks.SoftAssetRemapCB"
    args:
      asset_path: helcom_sedtype.csv
      key_col: sedi
      val_col: sedtype_id
      col_src: sedi
      col_remap: SED_TYPE
      grps: [SEDIMENT]

  # ── Filter status (literal dict) ─────────────────────────────────────────
  - path: "marisco.callbacks.SoftAssetRemapCB"
    args:
      lut: {N: 2, n: 2, F: 1}
      col_src: filt
      col_remap: FILT
      grps: [SEAWATER]

  # Sample metadata
  - path: "marisco.handlers.helcom.AddSampleIDCB"
    args: {}
  - path: "marisco.handlers.helcom.AddDepthCB"
    args: {}
  - path: "marisco.handlers.helcom.AddSalinityCB"
    args: {}
  - path: "marisco.handlers.helcom.AddTemperatureCB"
    args: {}
  - path: "marisco.handlers.helcom.RemapSedSliceTopBottomCB"
    args: {}

  # Weights (BIOTA + SEDIMENT)
  - path: "marisco.handlers.helcom.CleanBasisCB"
    args: {}
  - path: "marisco.handlers.helcom.PercentWeightCB"
    args: {}
  - path: "marisco.handlers.helcom.WeightCB"
    args: {}

  # Coordinate parsing (default fn_convert_cor=ddmm_to_dd)
  - path: "marisco.handlers.helcom.ParseCoordinatesCB"
    args: {}

# ── Plugin post-chain ─────────────────────────────────────────────────────────
