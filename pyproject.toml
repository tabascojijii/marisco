[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "marisco"
dynamic = ["version"]
description = "MARIS companion package and tutorials"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Franck Albinet, Niall Murphy", email = "franckalbinet@gmail.com"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python', 'netcdf', 'marine', 'radioactivity', 'data']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['pandas', 'openpyxl', 'fastcore', 'rich', 'tqdm', 'netcdf4', 'tomli', 'tomli-w', 'shapely', 'pyzotero', 'jellyfish', 'requests', 'pyarrow', 'gevent>=22.10.2', 'pydantic']

[project.urls]
Repository = "https://github.com/franckalbinet/marisco"
Documentation = "https://franckalbinet.github.io/marisco"

[project.entry-points.nbdev]
marisco = "marisco._modidx:d"

[project.optional-dependencies]
dev = ['nbdev', 'ipykernel', 'twine', 'toolslm', 'python-pptx', 'ruff', 'mypy', 'vulture', 'bandit', 'pytest-cov', 'radon']


[project.scripts]
maris_to_nc = "marisco.cli.to_nc:main"
maris_db_to_nc = "marisco.cli.db_to_nc:main"
maris_nc_to_csv = "marisco.cli.nc_to_csv:main"

[tool.setuptools.dynamic]
version = {attr = "marisco.__version__"}

[tool.setuptools.packages.find]
include = ["marisco"]

[tool.setuptools.package-data]
marisco = ["files/lut/*.xlsx", "files/nc/*.nc"]

[tool.nbdev]
custom_sidebar = true

[tool.jupytext]
formats = "ipynb,.pct.py:percent"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "ERA"]
ignore = [
    "E501",   # line-too-long 
    "ERA001", # commented-out-code 
    "ARG002", # unused-method-argument 
    "ARG001", # unused-function-argument
    "F403",   # undefined-local-with-import-star 
    "F405",   # undefined-local-with-import-star-usage
    "E701",   # multiple-statements-on-one-line-colon
    "E402",   # module-import-not-at-top-of-file
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  
ignore_missing_imports = true 

[tool.vulture]
min_confidence = 80       
paths = ["."]               
exclude = [".venv", "build"] 